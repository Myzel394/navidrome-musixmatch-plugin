name: Test

on:
  pull_request:
  schedule:
    - cron: "34 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: plugin/go.sum

      - name: Run tests
        working-directory: plugin
        run: go test ./...

      - name: Notify daily test failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --show-error --silent --retry 3 \
            --header "Title: [navidrome-musixmatch-plugin] Daily test failed" \
            --data "Daily test failed: ${RUN_URL}" \
            "${NTFY_TOPIC_URL}"
