name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  release:
    runs-on: node-lts
    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends bash curl git ca-certificates sudo tar xz-utils

      - name: Checkout repository
        uses: https://github.com/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ forgejo.ref }}
          fetch-depth: 0
          token: ${{ forgejo.token }}
          persist-credentials: false

      - name: Install Nix
        shell: bash
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail

          # The node-lts container runs this job as root, but the official
          # no-daemon Nix installer is a single-user install and rejects root.
          # Create a dedicated non-root user and install Nix into that account.
          useradd --create-home --shell /bin/bash builder
          mkdir -p /nix
          chown builder:builder /nix

          sudo -H -u builder env HOME=/home/builder USER=builder bash -lc '
            set -euo pipefail
            curl --fail --location https://nixos.org/nix/install | sh -s -- --no-daemon
            mkdir -p "$HOME/.config/nix"
            printf "%s\n" "experimental-features = nix-command flakes" > "$HOME/.config/nix/nix.conf"
          '

      - name: Build release package
        shell: bash
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          OPENOBSERVE_AUTH_TOKEN: ${{ secrets.OPENOBSERVE_AUTH_TOKEN }}
          OPENOBSERVE_PLUGIN_SOURCE: forgejo-git.nerdvpn.de
        run: |
          set -euo pipefail

          # Build as the same non-root user that owns the single-user Nix
          # install. Later root/Node steps can still read the generated asset.
          chown -R builder:builder "$PWD"
          sudo -H -u builder env \
            HOME=/home/builder \
            USER=builder \
            OPENOBSERVE_AUTH_TOKEN="$OPENOBSERVE_AUTH_TOKEN" \
            OPENOBSERVE_PLUGIN_SOURCE="$OPENOBSERVE_PLUGIN_SOURCE" \
            bash -lc '. "$HOME/.nix-profile/etc/profile.d/nix.sh"; nix develop --impure -c just create-prod-release'
          test -f result/bin/navidrome-musixmatch-plugin.ndp

      - name: Generate Forgejo release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.NMP_FORGEJO_RELEASE_TOKEN }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_REF_NAME: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          # The build changes checkout ownership to builder; allow this root
          # step to read its tag history when creating release notes.
          git config --global --add safe.directory "$PWD"
          node .forgejo/scripts/generate-release.mjs .forgejo-release-id

      - name: Upload release asset
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.NMP_FORGEJO_RELEASE_TOKEN }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
        run: |
          set -euo pipefail
          node .forgejo/scripts/upload-release-asset.mjs \
            .forgejo-release-id \
            result/bin/navidrome-musixmatch-plugin.ndp \
            navidrome-musixmatch-plugin.ndp
